name: iOS

# Builds the app (packages/app) for iPhone and iPad.
#
# On every change to the app it compiles a simulator build, unsigned: no
# Apple account needed, it only shows the iOS app still builds.
#
# Run by hand (Actions → iOS → Run workflow, "Upload to TestFlight" ticked)
# it archives a signed release build and uploads it to App Store Connect,
# where it shows up in TestFlight after Apple has processed it. Signing is
# automatic: Xcode makes and renews the certificate and provisioning profile
# with an App Store Connect API key. That needs these repository secrets:
#   APPLE_TEAM_ID                  the developer team's ID (10 characters)
#   APP_STORE_CONNECT_KEY_ID       the API key's ID
#   APP_STORE_CONNECT_ISSUER_ID    the issuer ID shown above the API keys
#   APP_STORE_CONNECT_KEY          the key file's contents (AuthKey_….p8)

on:
  push:
    branches: [main]
    paths:
      - "packages/app/**"
      - "packages/client/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "packages/app/**"
      - "packages/client/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/ios.yml"
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload to TestFlight (needs the App Store Connect secrets)
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      # Each build a higher build number (TestFlight takes each number once).
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION: 0.1.${{ github.run_number }}
      UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # The newest Xcode the runner has (React Native needs a recent one).
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the app
        run: pnpm --filter @mdb/app typecheck

      # Continuous Native Generation: ios/ is made from app.json each time
      # (the CocoaPods install comes after, with its cache).
      - name: Generate the iOS project
        working-directory: packages/app
        run: pnpm exec expo prebuild --platform ios --no-install

      - name: Restore the CocoaPods cache
        uses: actions/cache@v6
        with:
          path: |
            packages/app/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'packages/app/app.json') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install the pods
        working-directory: packages/app/ios
        run: pod install

      - name: Compile for the simulator (unsigned)
        if: env.UPLOAD != 'true'
        working-directory: packages/app/ios
        run: |
          set -o pipefail
          xcodebuild -workspace Wortschritt.xcworkspace -scheme Wortschritt -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              grep -E "error:|BUILD FAILED" "$RUNNER_TEMP/xcodebuild.log" | head -n 60
              tail -n 80 "$RUNNER_TEMP/xcodebuild.log"
              exit 1
            }
          tail -n 5 "$RUNNER_TEMP/xcodebuild.log"

      - name: Archive and upload to TestFlight
        if: env.UPLOAD == 'true'
        working-directory: packages/app/ios
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
        run: |
          set -o pipefail
          if [ -z "$TEAM_ID" ] || [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$KEY" ]; then
            echo "::error::The App Store Connect secrets are missing (APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY)."
            exit 1
          fi
          key="$RUNNER_TEMP/AuthKey_$KEY_ID.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$KEY" > "$key"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID")

          xcodebuild -workspace Wortschritt.xcworkspace -scheme Wortschritt -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Wortschritt.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${auth[@]}" archive > "$RUNNER_TEMP/xcodebuild.log" 2>&1 || {
              grep -E "error:|BUILD FAILED|ARCHIVE FAILED" "$RUNNER_TEMP/xcodebuild.log" | head -n 60
              tail -n 80 "$RUNNER_TEMP/xcodebuild.log"
              exit 1
            }

          # Exported for the App Store and sent straight to App Store Connect.
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Wortschritt.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${auth[@]}" 2>&1 | tail -n 60
          echo "::notice::Build ${APP_VERSION} (${APP_VERSION_CODE}) uploaded; it shows up in TestFlight once Apple has processed it."

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 14
          if-no-files-found: ignore
