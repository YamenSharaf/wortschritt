name: Android APK

# Builds the app (packages/app) into an installable APK and keeps it as a
# download on the run (Actions → this run → Artifacts). For testing on a phone
# or e-reader: a release build (the JavaScript is inside, no dev server
# needed) signed with the app's own key (the ANDROID_KEYSTORE_* secrets), the
# same on every build, so a newer APK installs over an older one. Without the
# secrets (a pull request from a fork) it keeps Expo's template debug key;
# main never publishes that.
#
# Builds of main are also published as a GitHub pre-release (tag app-<run>,
# version 0.1.<run>) so Obtainium can install and update the app from the
# repo's releases; only the latest few are kept.

on:
  push:
    branches: [main]
    paths:
      - "packages/app/**"
      - "packages/client/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "packages/app/**"
      - "packages/client/**"
      - "packages/shared/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      # write: publishing main's builds as releases (the step below).
      contents: write
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      # Each build gets a higher version code, so it installs as an update.
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION: 0.1.${{ github.run_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      # Gradle 9 (React Native 0.86) needs JDK 17 or newer.
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with its cache)
        uses: gradle/actions/setup-gradle@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the app
        run: pnpm --filter @mdb/app typecheck

      # Continuous Native Generation: android/ is made from app.json each time.
      - name: Generate the Android project
        working-directory: packages/app
        run: pnpm exec expo prebuild --platform android --no-install

      # Most of the build is compiling native C++ (React Native, Reanimated,
      # SQLite, ...), the same each time unless native modules change: ccache
      # keeps the compiled objects between runs (CMake picks it up from the
      # *_COMPILER_LAUNCHER variables below).
      - name: Set up ccache
        run: |
          sudo apt-get install -y --no-install-recommends ccache
          ccache --max-size=2G
          ccache --zero-stats

      - name: Restore the ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          # A new entry each run (a cache can't be updated); the newest one is restored.
          key: ccache-android-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            ccache-android-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            ccache-android-${{ runner.os }}-

      # arm64 only: the Boox and current phones; halves the build time and size.
      # --build-cache: Gradle reuses task outputs (Kotlin, Java, ...) kept in
      # its cache, which setup-gradle saves between runs.
      - name: Build the APK
        working-directory: packages/app/android
        env:
          CCACHE_DIR: /home/runner/.cache/ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPRESS: "1"
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --build-cache

      - name: ccache hits
        if: always()
        run: ccache --show-stats || true

      # Re-sign Gradle's output (aligned, debug-signed) with the app's key;
      # apksigner replaces the old signature. The generated project stays
      # untouched. main must be signed: it fails rather than publish a
      # debug-signed build.
      - name: Sign with the app's key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::The ANDROID_KEYSTORE_* secrets are missing; main is never published debug-signed."
              exit 1
            fi
            echo "::warning::No signing secrets: this APK keeps the debug signature."
            exit 0
          fi
          apk=packages/app/android/app/build/outputs/apk/release/app-release.apk
          ks="$RUNNER_TEMP/app.jks"
          trap 'rm -f "$ks"' EXIT
          echo "$KEYSTORE_BASE64" | base64 --decode > "$ks"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          "$apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$RUNNER_TEMP/signed.apk" "$apk"
          # Verify (fails the step if the signature is bad) and show whose it is;
          # apksigner's wording of the signer varies, so match loosely.
          "$apksigner" verify --verbose --print-certs "$RUNNER_TEMP/signed.apk" > "$RUNNER_TEMP/verify.txt"
          grep -E "Verified using|certificate (DN|SHA-256 digest)" "$RUNNER_TEMP/verify.txt" || cat "$RUNNER_TEMP/verify.txt"
          if grep -q "CN=Android Debug" "$RUNNER_TEMP/verify.txt"; then
            echo "::error::Still signed with the debug key."
            exit 1
          fi
          mv "$RUNNER_TEMP/signed.apk" "$apk"

      - name: Name it
        run: |
          mkdir -p out
          cp packages/app/android/app/build/outputs/apk/release/app-release.apk \
            "out/wortschritt-${{ github.run_number }}-${GITHUB_SHA::7}.apk"

      - name: Keep it on the run
        uses: actions/upload-artifact@v7
        with:
          name: wortschritt-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
          if-no-files-found: error

      # For Obtainium: main's builds as pre-releases (not mistaken for a
      # server release), the newest 10 kept.
      - name: Publish as a pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          tag="app-${{ github.run_number }}"
          gh release create "$tag" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Wortschritt app ${APP_VERSION}" \
            --notes "Android test build ${APP_VERSION} from ${GITHUB_SHA::7}."
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("app-"))] | sort_by(.createdAt) | reverse | .[env.KEEP | tonumber:] | .[].tagName' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
