name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we intend to push (skips on PRs / forks).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Build on PRs to validate the Dockerfile; only push elsewhere.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After a successful push, ask Komodo to redeploy the stack so it pulls the
      # freshly published image and updates the running deployment. Skipped on
      # PRs and when the Komodo variables aren't configured.
      - name: Trigger Komodo stack update
        if: >-
          github.event_name != 'pull_request' &&
          vars.KOMODO_HOST != '' && vars.APP_STACK_ID != ''
        env:
          KOMODO_HOST: ${{ vars.KOMODO_HOST }}
          KOMODO_KEY: ${{ secrets.KOMODO_KEY }}
          KOMODO_SECRET: ${{ secrets.KOMODO_SECRET }}
          STACK_ID: ${{ vars.APP_STACK_ID }}
        run: |
          host="${KOMODO_HOST%/}"
          case "$host" in
            http://*|https://*) ;;
            *) host="https://$host" ;;
          esac
          echo "Requesting DeployStack for stack ${STACK_ID} at ${host}"
          curl --fail-with-body -sS -X POST "${host}/execute" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: ${KOMODO_KEY}" \
            -H "X-Api-Secret: ${KOMODO_SECRET}" \
            -d "{\"type\":\"DeployStack\",\"params\":{\"stack\":\"${STACK_ID}\"}}"
          echo
