name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we intend to push (skips on PRs / forks).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Build on PRs to validate the Dockerfile; only push elsewhere.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # After a successful push, deploy the stack in Komodo. DeployStack pulls
      # the images first (the stack has auto_pull on), then runs `compose up`,
      # which recreates the container only when the image changed. Skipped on
      # PRs and when the Komodo variables aren't configured.
      #
      # Execute calls return at once with an Update and run in the background,
      # so the request never sits behind the ~100s Cloudflare origin timeout in
      # front of the Komodo host (which used to fail the job with a 524). We
      # then read that Update until it's done and fail the job if the pull or
      # the deploy failed. Komodo's own image polling stays on as a fallback.
      - name: Deploy the stack in Komodo
        if: >-
          github.event_name != 'pull_request' &&
          vars.KOMODO_HOST != '' && vars.APP_STACK_ID != ''
        env:
          KOMODO_HOST: ${{ vars.KOMODO_HOST }}
          KOMODO_KEY: ${{ secrets.KOMODO_KEY }}
          KOMODO_SECRET: ${{ secrets.KOMODO_SECRET }}
          STACK_ID: ${{ vars.APP_STACK_ID }}
        run: |
          host="${KOMODO_HOST%/}"
          case "$host" in
            http://*|https://*) ;;
            *) host="https://$host" ;;
          esac
          komodo() {
            curl --fail-with-body -sS --max-time 60 --retry 2 --retry-all-errors \
              -X POST "${host}/$1" \
              -H "Content-Type: application/json" \
              -H "X-Api-Key: ${KOMODO_KEY}" \
              -H "X-Api-Secret: ${KOMODO_SECRET}" \
              -d "$2"
          }

          echo "DeployStack for stack ${STACK_ID} at ${host}"
          update=$(komodo execute "$(jq -nc --arg s "$STACK_ID" '{type:"DeployStack",params:{stack:$s}}')")
          id=$(jq -r '._id["$oid"] // ._id // empty' <<<"$update")
          if [ -z "$id" ]; then
            echo "::error::Komodo didn't start a deploy: $update"
            exit 1
          fi
          echo "Komodo update ${id}"

          # Wait for it (up to 5 minutes), then report how each stage went.
          for _ in $(seq 1 60); do
            sleep 5
            update=$(komodo read "$(jq -nc --arg id "$id" '{type:"GetUpdate",params:{id:$id}}')") || continue
            [ "$(jq -r '.status' <<<"$update")" = "Complete" ] && break
          done
          jq -r '.logs[]? | "\(if .success then "✓" else "✗" end) \(.stage)" + (if .success then "" else "\n\(.stderr)" end)' <<<"$update"
          if [ "$(jq -r '.status' <<<"$update")" != "Complete" ]; then
            echo "::error::The deploy didn't finish within 5 minutes (Komodo update ${id})."
            exit 1
          fi
          if [ "$(jq -r '.success' <<<"$update")" != "true" ]; then
            echo "::error::The deploy failed in Komodo (update ${id})."
            exit 1
          fi
          echo "Deployed."

