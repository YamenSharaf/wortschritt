# The download page (site/) on GitHub Pages, at wortschritt.yamen.dev, with
# docs/self-hosting.md as /docs/ (scripts/site-docs.mjs). The page reads the
# newest app build from the releases API itself, so it only needs publishing
# when site/ or the guide changes. One-time setup: Settings → Pages →
# Source "GitHub Actions", custom domain wortschritt.yamen.dev.
name: Download page

on:
  push:
    branches: [main]
    paths: ["site/**", "docs/self-hosting.md", "scripts/site-docs.mjs", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build the site
        run: |
          cp -r site _site
          mkdir -p _site/docs
          npx --yes marked@18.0.14 --gfm -i docs/self-hosting.md | node scripts/site-docs.mjs > _site/docs/index.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
