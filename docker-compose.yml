services:
  app:
    build: .
    image: mit-dem-baby
    ports:
      - "3000:3000"
    environment:
      # Override these — do NOT ship the defaults.
      APP_PASSWORD: ${APP_PASSWORD:-change-me}
      SESSION_SECRET: ${SESSION_SECRET:-please-change-this-to-a-long-random-string}
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/app.db
      CONTENT_DIR: /app/content
      APP_NAME: ${APP_NAME:-mit dem baby}
      APP_EMOJI: ${APP_EMOJI:-🍼}
      # AI tutor (optional) — see .env.example for details.
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://api.openai.com/v1}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
      TTS_URL: ${TTS_URL-http://piper:5000}
    volumes:
      # Persist the SQLite database across restarts/upgrades.
      - ./data:/app/data
      # Optional: edit git-versioned content without rebuilding the image.
      - ./content:/app/content:ro
    depends_on:
      - piper
    restart: unless-stopped

  # Neural German pronunciation (Piper), built from ./piper. Internal only.
  piper:
    build: ./piper
    image: mit-dem-baby-piper
    volumes:
      - piper-voices:/voices
    restart: unless-stopped

volumes:
  piper-voices:
