# Homelab deployment — pulls the pre-built image from GHCR. No repo checkout
# or build needed. Just this file + a .env alongside it.
#
#   1. Create a .env next to this file:
#        APP_PASSWORD=your-strong-password
#        SESSION_SECRET=some-long-random-string
#   2. docker compose -f docker-compose.prod.yml up -d
#   3. Update later with:
#        docker compose -f docker-compose.prod.yml pull && \
#        docker compose -f docker-compose.prod.yml up -d
#
services:
  app:
    image: ghcr.io/yamensharaf/wortschritt:latest
    ports:
      - "3000:3000"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # Admin account created on first boot (password = APP_PASSWORD).
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/app.db
      CONTENT_DIR: /app/content
      # AI tutor: each user sets their own provider in the app; their API keys
      # are encrypted with this (openssl rand -base64 32 — keep a copy).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Legacy: copied once into the admin's AI settings on first boot.
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://api.openai.com/v1}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
      # Public URL (e.g. https://deutsch.example.com) for MCP sign-in (OAuth).
      # Optional: by default it's taken from the request (works behind a tunnel).
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Online dictionary (Wiktionary) under the offline gloss; "off" = offline only.
      DICTIONARY_API_URL: ${DICTIONARY_API_URL:-}
    volumes:
      # SQLite database (progress, settings, imported content) — back this up.
      - ./data:/app/data
      # Optional: override the baked-in git content without rebuilding.
      # - ./content:/app/content:ro
    restart: unless-stopped
