<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wortschritt</title>
    <meta name="description" content="Download the Wortschritt Android app." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #ffffff;
        --ink: #14171c;
        --muted: #5b6370;
        --border: #e2e5ea;
        --brand: #22589a;
        --brand-ink: #ffffff;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --surface: #171b21;
          --ink: #eceff3;
          --muted: #9aa3af;
          --border: #2a3039;
          --brand: #4f86c9;
          --brand-ink: #0b1018;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main { width: 100%; max-width: 420px; display: grid; gap: 20px; }
      header { display: flex; align-items: center; gap: 14px; }
      header img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { margin: 0; font-size: 24px; line-height: 1.2; }
      .sub { margin: 0; color: var(--muted); font-size: 14px; }
      .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; display: grid; gap: 14px; }
      .build { font-weight: 600; }
      .download {
        display: block;
        text-align: center;
        padding: 14px 18px;
        border-radius: 12px;
        background: var(--brand);
        color: var(--brand-ink);
        font-weight: 600;
        text-decoration: none;
      }
      .download[aria-disabled="true"] { opacity: 0.5; pointer-events: none; }
      .note { margin: 0; color: var(--muted); font-size: 14px; }
      .links { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
      a { color: var(--brand); }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="icon-192.png" alt="" />
        <div>
          <h1>Wortschritt</h1>
          <p class="sub">German reading and practice, on your own server.</p>
        </div>
      </header>

      <section class="card" aria-live="polite">
        <div>
          <div class="build" id="build">Android app</div>
          <div class="sub" id="meta">Looking for the newest build…</div>
        </div>
        <a class="download" id="download" href="https://github.com/YamenSharaf/wortschritt/releases" aria-disabled="true">Download the APK</a>
        <p class="note">Once installed, the app updates itself.</p>
      </section>

      <nav class="links">
        <a href="https://github.com/YamenSharaf/wortschritt/releases">All builds</a>
        <a href="https://github.com/YamenSharaf/wortschritt#readme">Source and self-hosting</a>
      </nav>
    </main>

    <script>
      // The newest app-<run> pre-release, read from GitHub each visit (the page itself never needs rebuilding).
      (async () => {
        const meta = document.getElementById("meta");
        const link = document.getElementById("download");
        try {
          const res = await fetch("https://api.github.com/repos/YamenSharaf/wortschritt/releases?per_page=10");
          if (!res.ok) throw new Error(res.status);
          let best = null;
          for (const r of await res.json()) {
            const m = /^app-(\d+)$/.exec(r.tag_name);
            const apk = r.assets.find((a) => a.name.endsWith(".apk"));
            if (!r.draft && m && apk && (!best || Number(m[1]) > best.build)) best = { build: Number(m[1]), apk, at: r.published_at };
          }
          if (!best) throw new Error("no build");
          document.getElementById("build").textContent = `Android app · build ${best.build}`;
          const date = new Date(best.at).toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" });
          meta.textContent = `${date} · ${Math.round(best.apk.size / 1e6)} MB`;
          link.href = best.apk.browser_download_url;
        } catch {
          meta.textContent = "Couldn't reach GitHub: pick the newest app-… build from the list.";
        }
        link.removeAttribute("aria-disabled");
      })();
    </script>
  </body>
</html>
