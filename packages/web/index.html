<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The German is what's being learned: no browser auto-translation
         (translate="no" above; this meta for Chrome's older check). -->
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Wortschritt — Learn German</title>
    <script>
      // This device's appearance before the first paint (no flash of the wrong
      // scheme on a dark e-reader). Keys and values: `preferences` in
      // packages/client/src/storage.ts; kept up to date by lib/appearance.ts.
      try {
        var s = localStorage.getItem("mdb-scheme"), d = localStorage.getItem("mdb-display");
        if (s === "light" || s === "dark") document.documentElement.dataset.scheme = s;
        if (d === "eink") document.documentElement.dataset.display = d;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
