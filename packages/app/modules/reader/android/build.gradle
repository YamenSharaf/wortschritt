// The Compose reader (the reader spike's native engine). Set up like
// @expo/ui 57: the Compose compiler plugin at the project's Kotlin version.
buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'eu.yamen.wortschritt'
version = '0.1.0'

android {
  namespace "eu.yamen.wortschritt.reader"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  implementation 'androidx.compose.foundation:foundation-android:1.10.6'
  implementation 'androidx.compose.ui:ui-android:1.10.6'
  implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'
  implementation "androidx.core:core-ktx:1.18.0"
}
